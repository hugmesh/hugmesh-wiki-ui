<header class="wiki-head">
  <h1>Wiki</h1>
  <p class="wiki-head__sub" id="wiki-console-help">
    Manage the platform wiki: read and author content, and control who may access it.
  </p>

  @if (visibleItems().length > 0) {
    <nav class="wiki-nav" role="menubar" aria-label="Wiki console" aria-describedby="wiki-console-help">
      @for (item of visibleItems(); track item.path; let i = $index) {
        <a
          #navlink
          role="menuitem"
          class="wiki-nav__item"
          [routerLink]="['./', item.path]"
          routerLinkActive="wiki-nav__item--active"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="item.aria"
          [attr.aria-describedby]="'wiki-nav-help-' + item.path"
          [attr.tabindex]="tabindexFor(i)"
          (keydown)="onKey($event, i)"
          [attr.data-testid]="'wiki-nav-' + item.path"
        >
          {{ item.label }}
        </a>
        <span class="sr" [id]="'wiki-nav-help-' + item.path">{{ item.help }}</span>
      }
    </nav>
  }
</header>

<router-outlet></router-outlet>
