server {
    # :8080 to match the federation-api wiki module registration (#16)
    # remote_entry_url = http://hugmesh-wiki-ui:8080/remoteEntry.json.
    # nginx-unprivileged listens on 8080 by default (non-root).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection (the SPA is never framed;
    #     module federation loads remotes via <script>, not iframes, so this is safe).
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    # STRICTER policies (Content-Security-Policy, COEP/CORP, Permissions-Policy) are
    # deliberately deferred — they need per-UI tuning (federation remotes, BFF
    # connect-src, matrix camera/mic) + browser validation in the live-cluster pass.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    location / {
        # nginx add_header inheritance: because this location declares its own
        # add_header, nginx drops the server-scope security headers here — so we
        # re-declare the same 4 security headers alongside the CORS header.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        # Same add_header inheritance rule applies here: this location's own
        # add_header (Content-Type) suppresses the server-scope security headers,
        # so re-declare them to keep the health endpoint covered too.
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
