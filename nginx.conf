# Per-response CSP nonce source. nginx has no built-in random function, so we
# reuse $request_id (a unique 32-hex-char token generated fresh for every
# request): unguessable and different on each response, which is exactly what a
# nonce must be. The `map` exposes it as $cspnonce so the sub_filter rewrite and
# the Content-Security-Policy header below always reference the SAME value for a
# given response.
#
# Scope note: the Dockerfile installs this file as
# `COPY nginx.conf /etc/nginx/conf.d/default.conf`, and the stock
# nginx-unprivileged /etc/nginx/nginx.conf does `include /etc/nginx/conf.d/*.conf;`
# from INSIDE the http block. So this file is http-scope: a bare `map` (an
# http-level directive) at the top is legal here, and must NOT be wrapped in an
# http { } block.
map $request_id $cspnonce {
    default $request_id;
}

server {
    # :8080 to match the federation-api wiki module registration (#16)
    # remote_entry_url = http://hugmesh-wiki-ui:8080/remoteEntry.json.
    # nginx-unprivileged listens on 8080 by default (non-root).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection (the SPA is never framed;
    #     module federation loads remotes via <script>, not iframes, so this is safe).
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.net host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # WHY THIS UI MUST SEND ITS OWN CSP: the gateway (hugmesh-gateway
    # SecurityConfig) applies a blanket fallback `script-src 'self'` to any
    # upstream response that carries NO CSP of its own. Angular native-federation
    # emits an INLINE `<script type="esms-options">` block plus a
    # `type="module-shim"` bootstrap in index.html; under that fallback the inline
    # block is blocked, es-module-shims is never configured, the app never
    # bootstraps and /wiki/ renders a blank <hug-wiki-root> with NO server error.
    # Sending the nonce-based policy below both fixes that and is strictly
    # stronger than the fallback it displaces.
    #
    # Content-Security-Policy (nonce-based XSS backstop) — tuned to what THIS UI
    # actually does (src/** audited: no web workers, no WebAssembly, no
    # <video>/<audio>, no EventSource/WebSocket, no webfonts, no third-party
    # origins). There is NO 'unsafe-inline'/'unsafe-hashes'/'unsafe-eval' in
    # script-src — only the per-response nonce, which sub_filter stamps onto every
    # <script> in index.html; es-module-shims (2.8.1) auto-propagates that nonce to
    # the module scripts it injects, so federation keeps working.
    #   - default-src 'self'                        : same-origin default. Every
    #                                                 directive deliberately NOT
    #                                                 listed below (media-src,
    #                                                 worker-src, font-src,
    #                                                 frame-src, manifest-src)
    #                                                 falls back to this — the app
    #                                                 uses none of them, so they
    #                                                 stay locked to 'self'.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : same-origin bundles + the
    #                                                 nonce'd bootstrap tags. blob:
    #                                                 is REQUIRED: es-module-shims
    #                                                 runs in shim mode
    #                                                 (type="module-shim") and
    #                                                 executes rewritten modules
    #                                                 from blob: URLs. No
    #                                                 'wasm-unsafe-eval' — this UI
    #                                                 ships no wasm.
    #   - style-src 'self' 'unsafe-inline'          : Angular injects component
    #                                                 styles as runtime <style>
    #                                                 elements which cannot carry a
    #                                                 nonce, so 'unsafe-inline' is
    #                                                 REQUIRED here (and only here).
    #   - img-src 'self' data:                      : favicon + any build-inlined
    #                                                 data: image. No remote images
    #                                                 are reachable: the DOMPurify
    #                                                 allow-lists in src/app/markdown.ts
    #                                                 strip <img> from both the
    #                                                 editor preview and the bff's
    #                                                 content_html, so https:/blob:
    #                                                 image sources are not granted.
    #   - connect-src 'self' https:                 : the wiki BFF is same-origin
    #                                                 (/bff/wiki/** proxied by the
    #                                                 fe-gateway, WIKI_BASE_URL
    #                                                 defaults to ''), but the host
    #                                                 can repoint it at deploy time
    #                                                 via globalThis.__HUG_WIKI_URL__
    #                                                 (src/app/wiki.service.ts), so
    #                                                 https: is allowed for that
    #                                                 env-configured origin. No wss:
    #                                                 — this UI opens no WebSocket
    #                                                 or EventSource (audited).
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : no framing of this app
    #                                                 (mirrors X-Frame-Options DENY).
    # NB: attachment downloads (wiki-attachments.component.ts saveBlob) build a
    # blob: object URL and click an <a download>. That is a download, not a fetch
    # or a script/media load, so no CSP directive governs it — blob: is
    # deliberately NOT added to connect-src/img-src/media-src for it.
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards ALL inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    # Runtime theme (fleet 50-snap-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's SNAP_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has several <script> tags (the
        #                           esms-options inline block, the polyfills, the
        #                           module-shim bootstrap) — rewrite ALL of them.
        #   - sub_filter_types text/html : ONLY rewrite the HTML document; JS/CSS
        #                           bundles are left byte-for-byte untouched (they
        #                           can legitimately contain the literal "<script").
        # Do NOT enable gzip_static / precompressed index.html — sub_filter cannot
        # rewrite an already-compressed response body, which would leave the
        # <script> tags un-nonced and silently reintroduce the blank-page bug.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # nginx add_header inheritance: because this location declares its own
        # add_header, nginx drops the server-scope security headers here — so we
        # re-declare the same 4 security headers alongside the CORS + CSP headers.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data:; connect-src 'self' blob: https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        # Same add_header inheritance rule applies here: this location's own
        # add_header (Content-Type) suppresses the server-scope security headers,
        # so re-declare them to keep the health endpoint covered too.
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
